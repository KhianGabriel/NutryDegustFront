<header>
  <img src="../../../assets/img/logo.png" alt="Nutry e Degust" class="logo">
  <nav>
    <a [routerLink]="['/index']" routerLinkActive="active">Início</a>
    <a [routerLink]="['/estoque']" routerLinkActive="active">Estoque</a>
    <a [routerLink]="['/produtos']" routerLinkActive="active">Produtos</a>
    <a [routerLink]="['/pedidos']" routerLinkActive="active">Pedidos</a>
    <a [routerLink]="['/vendas']" routerLinkActive="active">Vendas</a>
    <a [routerLink]="['/clientes']" routerLinkActive="active">Clientes</a>
    <a [routerLink]="['/fornecedores']" routerLinkActive="active">Fornecedores</a>
    <a [routerLink]="['/funcionarios']" routerLinkActive="active">Funcionários</a>
    <a [routerLink]="['/relatorios']" routerLinkActive="active">Relatórios</a>
    <a [routerLink]="['/ajuda']" class="help-button" routerLinkActive="active">?</a>
  </nav>
</header>

<div class="main-content">
  <div class="form-container">
    <h1 class="form-title">Lista de Produtos</h1>

    <div class="acoes-container">
      <input class="filtro" type="text" placeholder="Buscar por nome ou código" />
      <button class="btn-adicionar" (click)="chamarCadastroProdutos()">+ Adicionar Produto</button>
    </div>

    <div class="form-section">
      <table class="tabela-produtos">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Código</th>
            <th>Validade</th>
            <th>Descrição</th>
            <th>Preço de Venda</th>
            <th>Preço Pago</th>
            <th>Fornecedor</th>
            <th>Estoque</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Arroz 5kg</td>
            <td>PRD001</td>
            <td>10/12/2025</td>
            <td>Arroz branco tipo 1</td>
            <td>R$ 29,90</td>
            <td>R$ 18,00</td>
            <td>Fornecedor A</td>
            <td>Estoque Central</td>
            <td>
              <button title="Editar">
                <i class="fa fa-pencil-alt text-primary"></i>
              </button>
              <button title="Excluir">
                <i class="fa fa-trash-alt text-danger"></i>
              </button>
              <button title="Detalhes">
                <i class="fa fa-info-circle text-info"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
