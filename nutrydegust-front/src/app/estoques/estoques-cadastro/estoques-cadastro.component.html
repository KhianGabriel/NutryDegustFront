<header>
  <img src="assets/img/logo.png" alt="Nutry e Degust" class="logo">
  <nav>
    <a (click)="chamarInicio()">Início</a>
    <a class="active" href="#">Estoque</a>
    <a (click)="chamarProdutos()">Produtos</a>
    <a>Pedidos</a>
    <a>Vendas</a>
    <a>Clientes</a>
    <a (click)="chamarFornecedores()">Fornecedores</a>
    <a (click)="chamarFuncionarios()">Funcionários</a>
    <a>Relatórios</a>
    <a>?</a>

  </nav>
</header>

<div class="main-content">
  <div class="form-container">
    <h1 class="form-title">Cadastro de Estoque</h1>
    <div class="form-section">
      <h3 class="section-title">Informações do Estoque</h3>

      <form [formGroup]="estoqueForm" (ngSubmit)="cadastrarEstoque()">
        <div class="form-row">
          <div class="form-field">
            <label for="nomeEstoque">Nome do Estoque:*</label>
            <input type="text" formControlName="nome" id="nomeEstoque" placeholder="Digite o nome do Estoque: Ex. 'Estoque Central' ">
            <div class="erro" *ngIf="estoqueForm.get('nome')?.invalid && (estoqueForm.get('nome')?.dirty || estoqueForm.get('nome')?.touched)">
              <span *ngIf="estoqueForm.get('nome')?.errors?.['required']">O nome do estoque é obrigatório.</span>
            </div>
            <div class="erro" *ngIf="errosServidor?.nome">
              {{ errosServidor.nome }}
            </div>
          </div>
        </div>

        <div class="erro" *ngIf="errosServidor?.geral">
          {{ errosServidor.geral }}
        </div>

        <div class="form-buttons">
          <button type="submit" class="btn btn-save">Salvar</button>
          <button type="button" class="btn btn-cancel" (click)="chamarEstoque()">Cancelar</button>
        </div>
      </form>
    </div>
  </div>
</div>
